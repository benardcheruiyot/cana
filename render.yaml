services:
  - type: web
    name: green-rise-store
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build && cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: APP_DOMAIN
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
      - key: EMAIL_TEST_ENDPOINT_ENABLED
        value: "false"
      - key: EMAIL_TEST_TOKEN
        sync: false
