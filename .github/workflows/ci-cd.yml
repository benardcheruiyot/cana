name: Natuleaf CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Validate PM2 config
        run: |
          node -e "const cfg = require('./backend/ecosystem.config.js'); if (!cfg.apps || !cfg.apps[0] || !cfg.apps[0].name) throw new Error('PM2 app name missing'); console.log('PM2 app OK:', cfg.apps[0].name);"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: natuleaf-build
          path: frontend/dist

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to InterServer
        env:
          SSH_USER: ${{ secrets.INTERSERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.INTERSERVER_PRIVATE_KEY }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN || 'natuleaf.site' }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || 'https://natuleaf.site,https://www.natuleaf.site' }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR || '/opt/natuleaf-storefront' }}
          APP_PORT: '4101'
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ secrets.TELEGRAM_NOTIFICATIONS_ENABLED || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x ./scripts/deploy-server.sh
          ./scripts/deploy-server.sh "${{ secrets.INTERSERVER_HOST }}"

      - name: Smoke test deployment
        run: |
          echo "Deployment finished for natuleaf.site. Verify HTTPS and API health after DNS has propagated."
