name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storefront-build
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.INTERSERVER_HOST }}
          username: ${{ secrets.INTERSERVER_USER }}
          password: ${{ secrets.INTERSERVER_PASSWORD }}
          script: |
            set -e
            export PATH="$PATH:/usr/local/bin"
            mkdir -p ~/cana
            cd ~/cana
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git remote set-url origin https://github.com/${{ github.repository }}.git
              git fetch origin main
              git checkout main
              git pull --ff-only origin main
            fi
            npm ci
            cd frontend
            npm ci
            npm run build
            cd ../backend
            npm ci
            cat > .env <<'EOF'
            PORT=4000
            CORS_ORIGIN=https://greenlinewellnes.shop,https://www.greenlinewellnes.shop
            APP_DOMAIN=greenlinewellnes.shop
            EOF
            npm install -g pm2
            pm2 delete cana || true
            pm2 start index.js --name cana --watch false --cwd "$PWD"
            pm2 save
