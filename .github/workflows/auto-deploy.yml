name: Natuleaf Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      INTERSERVER_HOST: ${{ secrets.INTERSERVER_HOST }}
      INTERSERVER_USER: ${{ secrets.INTERSERVER_USER }}
      INTERSERVER_PRIVATE_KEY: ${{ secrets.INTERSERVER_PRIVATE_KEY }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN || 'natuleaf.site' }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || 'https://natuleaf.site,https://www.natuleaf.site' }}
      REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR || '/opt/natuleaf-storefront' }}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${{ secrets.TELEGRAM_NOTIFICATIONS_ENABLED || 'true' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
          cd ../backend && npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.INTERSERVER_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.INTERSERVER_USER }}
          APP_PORT: 4101
          APP_DOMAIN: ${{ secrets.APP_DOMAIN || 'natuleaf.site' }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || 'https://natuleaf.site,https://www.natuleaf.site' }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR || '/opt/natuleaf-storefront' }}
        run: |
          echo "=== Deployment Configuration ==="
          echo "Target host: ${INTERSERVER_HOST}"
          echo "SSH user: ${SSH_USER}"
          echo "App directory: ${REMOTE_APP_DIR}"
          echo "SSH_PRIVATE_KEY is set: $([ -n "$SSH_PRIVATE_KEY" ] && echo 'yes' || echo 'no')"
          echo "SSH version:"
          ssh -V
          echo ""
          chmod +x ./scripts/deploy-server.sh
          ./scripts/deploy-server.sh "$INTERSERVER_HOST"

      - name: Post-deploy health reminder
        run: |
          echo "Site is being deployed to natuleaf.site using /opt/natuleaf-storefront and PM2 app natuleaf-storefront."
