name: Build & Auto Deploy
# Minor update to trigger deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build --silent

      - name: Validate required deploy secrets
        run: |
          required=(SSH_PRIVATE_KEY SSH_USER SSH_HOST TARGET_DIR PROD_HOST)
          missing=()
          for var in "${required[@]}"; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
          PROD_HOST: ${{ secrets.PROD_HOST }}

      - name: Prepare SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy dist via rsync
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" frontend/dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.TARGET_DIR }}

      - name: Generate backend env file (optional)
        if: ${{ secrets.BACKEND_TARGET_DIR && secrets.SMTP_USER && secrets.SMTP_PASS && secrets.APP_DOMAIN }}
        run: |
          echo "Writing backend env to backend_env.txt"
          SMTP_HOST="${SMTP_HOST:-smtp-relay.brevo.com}"
          SMTP_PORT="${SMTP_PORT:-587}"
          SMTP_SECURE="${SMTP_SECURE:-false}"
          SMTP_FROM="${SMTP_FROM:-Green Rise <no-reply@${APP_DOMAIN}>}"
          SMTP_REPLY_TO="${SMTP_REPLY_TO:-info@${APP_DOMAIN}}"

          {
            printf 'EMAIL_NOTIFICATIONS_ENABLED=true\n'
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_SECURE=%s\n' "$SMTP_SECURE"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
            printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN"
            printf 'SMTP_FROM="%s"\n' "$SMTP_FROM"
            printf 'SMTP_REPLY_TO="%s"\n' "$SMTP_REPLY_TO"
            printf 'EMAIL_TEST_ENDPOINT_ENABLED=false\n'
          } > backend_env.txt

          echo "Generated backend_env.txt:"
          cat backend_env.txt
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp-relay.brevo.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || '' }}
          SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO || '' }}

      - name: Upload backend env file (optional)
        if: ${{ secrets.BACKEND_TARGET_DIR && secrets.SMTP_USER && secrets.SMTP_PASS && secrets.APP_DOMAIN }}
        run: |
          echo "Uploading backend .env to $BACKEND_TARGET_DIR"
          scp -o StrictHostKeyChecking=no backend_env.txt "${SSH_USER}@${SSH_HOST}:${BACKEND_TARGET_DIR}/.env"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          BACKEND_TARGET_DIR: ${{ secrets.BACKEND_TARGET_DIR }}

      - name: Purge Cloudflare (optional)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN && secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq '.' || true

      - name: Compute local bundle SHA
        run: |
          ls -lah frontend/dist/assets
          file=$(ls frontend/dist/assets/index-*.js | head -n1)
          echo "LOCAL_JS_FILE=$file" >> $GITHUB_ENV
          sha256sum "$file" | awk '{print $1}' > local_sha.txt
          cat local_sha.txt

      - name: Download production bundle and compute SHA
        run: |
          PROD_URL="https://${PROD_HOST}/assets/$(basename ${LOCAL_JS_FILE})"
          echo "Attempting to download $PROD_URL"
          curl -sfL "$PROD_URL" -o prod_asset.js || true
          if [ -f prod_asset.js ]; then sha256sum prod_asset.js | awk '{print $1}' > prod_sha.txt; else echo 'MISSING' > prod_sha.txt; fi
          echo "PROD SHA:"; cat prod_sha.txt
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          LOCAL_JS_FILE: ${{ env.LOCAL_JS_FILE }}

      - name: Compare SHAs
        run: |
          echo "Local:"; cat local_sha.txt || true
          echo "Prod:"; cat prod_sha.txt || true
          if [ -f prod_sha.txt ] && [ "$(cat prod_sha.txt)" = "$(cat local_sha.txt)" ]; then echo "SHA_MATCH=true" >> $GITHUB_ENV; else echo "SHA_MATCH=false" >> $GITHUB_ENV; fi

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verification
          path: |
            local_sha.txt
            prod_sha.txt
